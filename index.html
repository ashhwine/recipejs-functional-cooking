<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
    </header>

    <main>
        <!-- Filter Buttons -->
        <section class="controls-section">
            <div class="controls-group">
                <h2>Filter Recipes</h2>
                <div class="button-group" id="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Recipes</button>
                    <button class="filter-btn" data-filter="easy">Easy</button>
                    <button class="filter-btn" data-filter="medium">Medium</button>
                    <button class="filter-btn" data-filter="hard">Hard</button>
                    <button class="filter-btn" data-filter="quick">Quick (< 30 min)</button>
                </div>
            </div>

            <!-- Sort Buttons -->
            <div class="controls-group">
                <h2>Sort By</h2>
                <div class="button-group" id="sort-buttons">
                    <button class="sort-btn" data-sort="none">Default</button>
                    <button class="sort-btn" data-sort="name">Name (A–Z)</button>
                    <button class="sort-btn" data-sort="time">Time (Fastest First)</button>
                </div>
            </div>
        </section>

        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
